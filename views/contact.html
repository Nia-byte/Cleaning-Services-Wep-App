<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niaimani Group- You are in good hands</title>
     <link rel="icon" type="image/png" href="/images/ICON.png">
     <link rel="stylesheet" href="/css/contact.css" />
    </head>
<body>
<!--  NavBar-->
 <header>
         <!-- NAV BAR Section -->
     <div class="navbar">
            <!-- Logo section - matches ui-relative ui-w-24 ui-z-200 -->

                <ul>
                    <li>
                        <!-- Logo link - matches ui-py-3 ui-block ui-w-16 lg:ui-w-20 -->
                        <a class="logo-link" href="/" aria-label="Niaimani home">
                           
                            <div class="logo-text">Niaimani<br>Group</div>
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Center navigation - matches ui-flex-1 ui-flex ui-items-center ui-justify-end ui-mx-2 ui-transition lg:ui-gap-12 sm:ui-mx-4 lg:ui-justify-center -->
            <div class="nav-center">
                <!-- Navigation links - matches ui-hidden lg:ui-flex lg:ui-gap-12 -->
                <ul class="nav-links">
                    <li>
                        <!-- Why Oura link with font-bold - matches ui-font-bold ui-cursor-default -->
                        <a href="/index.html" >Home</a>
                    </li>
                    <li>
                        <a href="/views/services.html" >Services</a>
                    </li>
                    <li>
                        <a href="/views/contact.html" class="font-bold">Contact</a>
                    </li>
                </ul>
                
                <!-- Shop button - matches ui-rounded-full ui-text-center ui-inline-block ui-transition ui-bg-blue-100 ui-text-sandstone-200 hover:ui-bg-blue-200 ui-py-2 ui-px-4 lg:ui-py-3 lg:ui-px-6 -->
                <a href="/views/book-a-service.html" class="shop-btn-container">
                    <span class="shop-btn-inner">
                        <span>Book a Service</span>
                    </span>
                </a>
            </div>

            <!-- Menu section - matches ui-flex ui-items-center ui-gap-3 -->
             <!-- Menu section - matches ui-flex ui-items-center ui-gap-3 -->
            <div class="menu-section">
                <button class="hamburger-btn" id="hamburger" type="button" aria-controls="navMenu" aria-expanded="false">
                    <span class="sr-only">Open header menu navigation</span>
                    <span class="hamburger-lines" aria-hidden="true"></span>
                </button>
            </div>
        </div>
       </header>

         <!-- Mobile Menu Overlay -->
    <div class="mobile-menu-overlay" id="menuOverlay"></div>

    <!-- Mobile Menu -->
    <div class="mobile-menu" id="mobileMenu" role="dialog" aria-modal="true" aria-label="Navigation menu">
        <div class="menu-header">
            <div class="menu-logo">
                <img src="/images/logo.png" alt="NiaImani Group Logo" /> 
            </div>
            <button class="close-btn" id="closeMenu" aria-label="Close menu">×</button>
        </div>

        <nav class="menu-nav" id="navMenu">
            <ul>
                <li><a href="/index.html">Home</a></li>
                <li><a href="/views/services.html" >Services</a></li>
                <li><a href="/views/contact.html" class="font-bold">Contact</a></li>
                <li><a href="/"></a></li>

               <a href="/views/book-a-service.html" class="shop-btn-container" style="color: white;">
                    <span class="shop-btn-inner">
                        <span>Book a Service</span>
                    </span>
                </a>
            </ul>
        </nav>

        <div class="menu-footer">
           
        </div>
    </div>


       <!--  HEROSECTION-->
    <div class="hero-container">
        <div class="content-wrapper">
            <div class="left-section">
                <h3>Let's Talk</h3>
                <h1>Ready to Take<br>the Next Step?</h1>
                <p>Have a question? We're here to help!</p>
                
                <div class="contact-info">
                    <div class="contact-item">
                        <div class="contact-icon"></div>
                        <span> (+27) 72 823 8385 </span>
                    </div>
                    <div class="contact-item">
                        <div class="contact-icon"></div>
                        <span>info@niaimani.co.za</span>
                    </div>
                    <div class="contact-item">
                        <div class="contact-icon"></div>
                        <span>Pretoria East, Gauteng, South Africa </span>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <form id="contactForm">
                    <div class="form-row">
                        <div class="form-group">
                            <input type="text" name="fullName" placeholder="Full Name" required>
                        </div>
                        <div class="form-group">
                            <input type="email" name="email" placeholder="Email Address" required>
                        </div>
                    </div>

                    <div class="radio-group">
                        <span style="font-size: 14px; color: #666;">I am an:</span>
                        <div class="radio-item">
                            <input type="radio" id="individual" name="contactType" value="Individual" checked>
                            <label for="individual">Individual</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="organization" name="contactType" value="Organization">
                            <label for="organization">Organization / Business</label>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <textarea name="message" placeholder="Your Message" required></textarea>
                    </div>
                     

                    <button type="submit" id="submitBtn" class="submit-btn">Submit</button>
                </form>
            </div>
        </div>
    </div>



   



    



<script src="/js/contact.js"></script>

    
</body>
</html>
